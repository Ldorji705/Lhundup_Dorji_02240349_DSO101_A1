name: Build and Deploy

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build and Push Backend
      - name: Build and Push Backend Image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/be-todo:02240349 ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/be-todo:02240349

      # 4. Build and Push Frontend
      - name: Build and Push Frontend Image
        run: |
          docker build --platform linux/amd64 \
            --build-arg VITE_API_URL=https://be-todo-02240349.onrender.com \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/fe-todo:02240349 ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/fe-todo:02240349

      # 5. Deploy Backend on Render
      - name: Trigger Backend Deployment
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}

      # 6. Deploy Frontend on Render
      - name: Trigger Frontend Deployment
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}